<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JM Trianon OS">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<title>JM Trianon — Ordem de Serviço</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --red: #c62828;
  --dark: #1a1a2e;
  --border: #ccc;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #e0e0e0; font-family: 'Source Sans 3', sans-serif; padding-bottom: 80px; }

/* TOOLBAR */
.toolbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--dark); padding: 6px 8px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.btn {
  border: none; border-radius: 8px; padding: 8px 13px;
  font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; color: #fff; letter-spacing: .5px;
}
.btn-produto { background: #b71c1c; }
.btn-salvar  { background: #4a148c; }
.btn-abrir   { background: #e65100; }
.btn-limpar  { background: #37474f; }
.btn-export  { background: #1b5e20; }
.btn-import  { background: #006064; }
.btn-print   { background: #1a237e; }
.toolbar-title { color: #fff; font-family: 'Oswald', sans-serif; font-size: 13px; flex: 1; text-align: center; }

/* PAGE WRAP */
.page-wrap { padding: 66px 6px 16px; display: flex; justify-content: center; }

/* A OS */
.page {
  width: 100%; max-width: 794px; background: #fff;
  padding: 10mm 10mm 8mm 10mm;
  box-shadow: 0 4px 24px rgba(0,0,0,.2);
}

/* HEADER BANNER */
.header {
  border: 2px solid var(--dark); border-radius: 4px;
  margin-bottom: 5px; overflow: hidden;
  background-size: cover; background-position: center;
  position: relative;
}
.header-overlay {
  background: rgba(0,0,0,.55);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 14px;
}
.logo-circle {
  width: 52px; height: 52px; border-radius: 50%;
  background: #fff; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border: 2px solid #f9a825;
}
.logo-circle svg { width: 30px; height: 30px; }
.header-text { flex: 1; }
.header-text h1 { font-family: 'Oswald', sans-serif; font-size: 20px; color: #f9a825; line-height: 1; }
.header-text h2 { font-family: 'Oswald', sans-serif; font-size: 10px; color: #fff; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; }
.header-text .services { font-family: 'Oswald', sans-serif; font-size: 8.5px; color: #eee; letter-spacing: .5px; }
.header-info { font-size: 8px; color: #eee; text-align: right; line-height: 1.7; }
.header-info .phone { background: var(--red); color: #fff; border-radius: 4px; padding: 2px 6px; font-weight: 700; font-size: 9px; display: inline-block; }

/* CAMPOS DO CLIENTE */
.fields-section { border: 1px solid var(--border); border-radius: 3px; margin-bottom: 5px; }
.fields-row { display: flex; border-bottom: 1px solid var(--border); }
.fields-row:last-child { border-bottom: none; }
.field {
  display: flex; align-items: center;
  padding: 3px 7px; flex: 1;
  border-right: 1px solid var(--border);
  font-size: 11px; gap: 3px; min-width: 0;
}
.field:last-child { border-right: none; }
.field label { font-weight: 700; color: #111; white-space: nowrap; font-size: 11px; }
.field input {
  flex: 1; border: none; border-bottom: 1px solid #888;
  outline: none; font-family: 'Source Sans 3', sans-serif;
  font-size: 11px; color: var(--dark); background: transparent;
  padding: 1px 2px; min-width: 0; width: 100%;
}

/* TABELA DE SERVIÇOS */
.services-table { width: 100%; border-collapse: collapse; margin-bottom: 5px; font-size: 11px; }
.services-table th {
  background: var(--dark); color: #fff;
  font-family: 'Oswald', sans-serif; font-size: 11px;
  padding: 5px 6px; text-align: center; white-space: nowrap;
}
.services-table th.col-desc { text-align: left; padding-left: 8px; }
.services-table td { border: 1px solid var(--border); height: 18px; padding: 0; }
.services-table td input {
  width: 100%; height: 100%; border: none; outline: none;
  background: transparent; font-family: 'Source Sans 3', sans-serif;
  font-size: 11px; color: var(--dark); padding: 0 4px;
  display: block;
}
.services-table tr:nth-child(even) td { background: #f9f9f9; }
.col-qty  { width: 36px; }
.col-unit { width: 60px; }
.col-tot  { width: 60px; }
.col-qty input, .col-unit input, .col-tot input { text-align: center; }
.col-unit input, .col-tot input { text-align: right; padding-right: 5px; }

/* FOOTER */
.footer-area { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-top: 4px; }
.obs-area { flex: 1; font-size: 10px; color: #222; line-height: 1.6; }
.obs-area .obs-title { font-weight: 700; font-size: 11px; color: var(--red); }
.obs-area .agree-line { margin-top: 5px; font-size: 10px; }
.totals-area { width: 180px; flex-shrink: 0; }
.totals-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.totals-table td { padding: 0; font-size: 11px; border: 1px solid var(--border); height: 22px; vertical-align: middle; }
.t-label { background: var(--dark); color: #fff; font-family: 'Oswald', sans-serif; font-size: 11px; padding: 0 6px; white-space: nowrap; }
.total-row .t-label { background: #b71c1c; }
.t-value { padding: 0 4px; }
.t-value input {
  width: 100%; height: 100%; border: none; outline: none;
  background: transparent; font-family: 'Source Sans 3', sans-serif;
  font-size: 11px; color: var(--dark); text-align: right;
  padding: 0 4px; display: block;
}

/* ASSINATURAS */
.sigs { display: flex; justify-content: space-between; margin-top: 14px; }
.sig { text-align: center; width: 42%; }
.sig-line { border-top: 1px solid #555; margin-bottom: 3px; }
.sig-label { font-size: 9px; color: #555; }
.sig-name { font-size: 11px; font-weight: 700; }

/* MEDIA */
@media (max-width: 480px) {
  .page { padding: 4mm 3mm; }
  .services-table { font-size: 10px; }
  .services-table th { font-size: 9px; padding: 3px 2px; }
  .totals-area { width: 160px; }
  .footer-area { gap: 6px; }
  .toolbar-title { display: none; }
  .btn { padding: 6px 10px; font-size: 11px; }
}
@media print {
  .toolbar, #install-banner, .toast, .sheet-overlay, .action-sheet { display: none !important; }
  .page-wrap { padding: 0; }
  .page { box-shadow: none; width: 100%; }
  .field input, .services-table td input, .t-value input { border-bottom: none !important; }
}

/* UI extras */
.toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: #1b5e20; color: #fff; padding: 12px 24px; border-radius: 24px; font-family: 'Oswald', sans-serif; font-size: 15px; z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
.toast.show { opacity: 1; }
.loading { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 9000; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #fff; font-family: 'Oswald', sans-serif; font-size: 16px; }
.loading.show { display: flex; }
.spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 400; }
.sheet-overlay.show { display: block; }
.action-sheet {
  position: fixed; top: 8%; left: 8px; right: 8px; max-width: 420px; margin: 0 auto;
  background: #fff; border-radius: 20px; padding: 16px; z-index: 401;
  transform: translateY(-30px) scale(.95); opacity: 0; pointer-events: none;
  transition: transform .3s ease, opacity .3s ease; max-height: 80vh; overflow-y: auto; overflow-x: hidden;
}
.action-sheet.show { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.sheet-title { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
.sheet-btn { display: block; width: 100%; padding: 12px; margin-bottom: 8px; border: none; border-radius: 10px; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
.sheet-close { background: #eee; color: #333; width: 100%; padding: 12px; border: none; border-radius: 10px; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
#install-banner { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--dark); color: #fff; padding: 10px 16px; gap: 10px; align-items: center; z-index: 500; font-size: 13px; font-family: 'Oswald', sans-serif; }
#install-banner.show { display: flex; }
#install-banner button { background: #f9a825; color: #000; border: none; border-radius: 8px; padding: 6px 14px; font-weight: 700; font-size: 13px; }

/* ZOOM CONTROLADO */
.page-wrap {
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
</style>
</head>
<body>

<div id="loading" class="loading"><div class="spinner"></div><span id="loading-msg">Aguarde...</span></div>
<div class="toast" id="toast"></div>
<input type="file" id="import-file-input" accept="application/json,.json,.txt" style="display:none">
<div id="install-banner"><span>📲 Instale o app para acesso rápido</span><button onclick="installApp()">Instalar</button><button onclick="document.getElementById('install-banner').classList.remove('show')" style="background:transparent;color:#aaa;border:none;font-size:18px;padding:0 6px">✕</button></div>

<!-- TOOLBAR -->
<div class="toolbar">
  <button class="btn btn-produto" onclick="adicionarLinha()">➕ Produto</button>
  <button class="btn btn-limpar" onclick="limpar()">🗑 Limpar</button>
  <button class="btn btn-salvar" onclick="salvarRascunho()">💾 Salvar</button>
  <button class="btn btn-abrir" onclick="abrirRascunhos()">📂 Abrir</button>
  <button class="btn btn-export" onclick="exportarArquivo()">📤 Exportar</button>
  <button class="btn btn-import" onclick="importarArquivo()">📥 Importar</button>
  <button class="btn btn-print" onclick="enviarWhatsapp()">📱 Enviar</button>
</div>

<!-- PAINEL ABRIR -->
<div class="sheet-overlay" id="drafts-overlay" onclick="fecharRascunhos()"></div>
<div class="action-sheet" id="drafts-sheet">
  <div class="sheet-title">📂 Ordens Salvas</div>
  <div id="drafts-list"></div>
  <button class="sheet-close" onclick="fecharRascunhos()">Fechar</button>
</div>

<!-- MENU ENVIAR -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="action-sheet" id="action-sheet">
  <div class="sheet-title">📤 Compartilhar OS</div>
  <button class="sheet-btn" style="background:#25d366;color:#fff" onclick="enviarWhatsappImg()">💬 WhatsApp (imagem)</button>
  <button class="sheet-btn" style="background:#1565c0;color:#fff" onclick="downloadImagem()">⬇️ Baixar imagem</button>
  <button class="sheet-btn" style="background:#555;color:#fff" onclick="window.print()">🖨️ Imprimir</button>
  <button class="sheet-close" onclick="closeSheet()">Cancelar</button>
</div>

<div class="page" id="os-page">

    <div class="fields-row">
      <div class="field"><label>Endereço:</label><input type="text" id="f-endereco" placeholder="Rua, número, bairro"></div>
    </div>
    <div class="fields-row">
      <div class="field" style="flex:2"><label>Carro:</label><input type="text" id="f-carro" placeholder="Marca / Modelo / Ano"></div>
      <div class="field" style="flex:.8"><label>Placa:</label><input type="text" id="f-placa" placeholder="ABC-1234" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" onfocus="this.select()" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" onfocus="this.select()" style="text-transform:uppercase"></div>
      <div class="field" style="flex:.5"><label>Nº:</label><input type="text" id="f-num" placeholder="001"></div>
    </div>
  </div>

  <!-- TABELA DE SERVIÇOS -->
  <table class="services-table">
    <thead>
      <tr>
        <th class="col-qty">QUANT.</th>
        <th class="col-desc">SERVIÇOS A EXECUTAR</th>
        <th class="col-unit">P. UNITÁRIO</th>
        <th class="col-tot">TOTAL</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <!-- FOOTER -->
  <div class="footer-area">
    <div class="obs-area">
      <div class="obs-title">OBS. GARANTIA De 30 a 90 DIAS</div>
      <div>Dependendo do Serviço feito</div>
      <div class="agree-line">Estou de acordo com os serviços executados</div>
    </div>
    <div class="totals-area">
      <table class="totals-table">
        <tr class="total-row"><td class="t-label">TOTAL</td><td class="t-value"><input type="text" id="t-total" placeholder="R$ 0,00" readonly style="background:#f5f5f5;cursor:default;font-weight:700"></td></tr>
        <tr><td class="t-label">SINAL</td><td class="t-value"><input type="text" id="t-sinal" placeholder="R$ 0,00"></td></tr>
        <tr><td class="t-label">RESTA</td><td class="t-value"><input type="text" id="t-resta" placeholder="R$ 0,00" readonly style="background:#f5f5f5;cursor:default"></td></tr>
      </table>
    </div>
  </div>

  <!-- ASSINATURAS -->
  <div class="sigs">
    <div class="sig">
      <div class="sig-line"></div>
      <div class="sig-label">Ass.:</div>
      <div class="sig-name">Cliente</div>
    </div>
    <div class="sig">
      <div class="sig-line"></div>
      <div class="sig-label">Ass.:</div>
      <div class="sig-name">Proprietário</div>
    </div>
  </div>

</div><!-- /page -->
</div><!-- /page-wrap -->

<script>
const tbody = document.getElementById('tbody');

// ── LINHAS DA TABELA ─────────────────────────────────────────────────────────
function criarLinha() {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="col-qty"><input type="text" inputmode="decimal" placeholder="0"></td>
    <td class="col-desc"><input type="text"></td>
    <td class="col-unit"><input type="text" inputmode="decimal" placeholder="0,00"></td>
    <td class="col-tot"><input type="text" inputmode="decimal" placeholder="0,00" readonly style="background:#f5f5f5;cursor:default;"></td>`;
  const qty  = tr.querySelector('.col-qty input');
  const unit = tr.querySelector('.col-unit input');
  const tot  = tr.querySelector('.col-tot input');
  const calc = () => {
    const q = parseBR(qty.value), u = parseBR(unit.value);
    tot.value = (q && u) ? fmtBR(q * u) : '';
    calcTotals();
  };
  qty.addEventListener('input', calc);
  unit.addEventListener('input', calc);
  return tr;
}

function adicionarLinha() {
  tbody.appendChild(criarLinha());
}

function parseBR(s) {
  if (!s) return 0;
  return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
}

function fmtBR(n) {
  return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function calcTotals() {
  let total = 0;
  Array.from(tbody.children).forEach(tr => {
    total += parseBR(tr.querySelector('.col-tot input').value);
  });
  document.getElementById('t-total').value = total ? 'R$ ' + fmtBR(total) : '';
  const sinal = parseBR(document.getElementById('t-sinal').value.replace('R$',''));
  const resta = total - sinal;
  document.getElementById('t-resta').value = total ? 'R$ ' + fmtBR(resta) : '';
}

document.getElementById('t-sinal').addEventListener('input', calcTotals);

// Inicializa com 20 linhas
for (let i = 0; i < 20; i++) tbody.appendChild(criarLinha());
document.getElementById('f-data').value = new Date().toISOString().split('T')[0];

// ── COLETA / APLICA DADOS ────────────────────────────────────────────────────
function coletarDados() {
  const dados = {};
  document.querySelectorAll('#os-page input[id]').forEach(inp => { dados[inp.id] = inp.value; });
  dados.itens = Array.from(tbody.children).map(tr => {
    const ins = tr.querySelectorAll('input');
    return [ins[0].value, ins[1].value, ins[2].value, ins[3].value];
  });
  return dados;
}

function aplicarDados(dados) {
  while (tbody.children.length < (dados.itens || []).length) tbody.appendChild(criarLinha());
  Object.keys(dados).forEach(k => {
    if (k === 'itens' || k === '_meta') return;
    const el = document.getElementById(k);
    if (el) el.value = dados[k];
  });
  Array.from(tbody.children).forEach((tr, i) => {
    const ins = tr.querySelectorAll('input');
    const item = (dados.itens || [])[i] || ['','','',''];
    ins[0].value = item[0] || '';
    ins[1].value = item[1] || '';
    ins[2].value = item[2] || '';
    ins[3].value = item[3] || '';
  });
  calcTotals();
}

// ── SALVAR / ABRIR ───────────────────────────────────────────────────────────
const AUTO_ID = 'jm_os_auto';

function salvarRascunho() {
  const dados = coletarDados();
  const id = window._osIdAtual || AUTO_ID;
  window._osIdAtual = id;
  dados._meta = {
    cliente: (dados['f-cliente'] || '').trim() || 'Sem nome',
    carro:   (dados['f-carro']   || '').trim() || '',
    placa:   (dados['f-placa']   || '').trim() || '',
    num:     (dados['f-num']     || '').trim() || '',
    salvoEm: new Date().toLocaleString('pt-BR')
  };
  try {
    let lista = JSON.parse(localStorage.getItem('jm_os_lista') || '[]');
    if (!lista.includes(id)) lista.unshift(id);
    localStorage.setItem('jm_os_lista', JSON.stringify(lista));
    localStorage.setItem(id, JSON.stringify(dados));
    toast('💾 Salvo! Toque em "Abrir" para ver todas as ordens.', 4000);
  } catch(e) {
    toast('❌ Não foi possível salvar.');
  }
}

function abrirRascunhos() {
  const lista = JSON.parse(localStorage.getItem('jm_os_lista') || '[]');
  const container = document.getElementById('drafts-list');
  container.innerHTML = '';
  if (!lista.length) {
    container.innerHTML = '<p style="text-align:center;color:#999;padding:20px">Nenhuma ordem salva ainda.</p>';
  }
  lista.forEach(id => {
    const raw = localStorage.getItem(id);
    if (!raw) return;
    let dados;
    try { dados = JSON.parse(raw); } catch(e) { return; }
    const meta = dados._meta || {};
    const row = document.createElement('div');
    row.style.cssText = 'padding:10px 0;border-bottom:1px solid #eee;';
    row.innerHTML = `
      <div style="margin-bottom:8px;overflow:hidden;">
        <div style="font-weight:700;font-size:14px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
          🧑 ${meta.cliente || 'Sem nome'}${meta.num ? ' · Nº ' + meta.num : ''}
        </div>
        ${meta.carro ? `<div style="font-size:12px;color:#333;margin-top:2px;">🚗 ${meta.carro}${meta.placa ? ' · ' + meta.placa : ''}</div>` : ''}
        <div style="font-size:11px;color:#999;margin-top:2px;">🕐 ${meta.salvoEm || ''}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button style="flex:1;background:#1565c0;color:#fff;border:none;border-radius:8px;padding:10px 0;font-size:14px;font-weight:600;" onclick="carregarRascunho('${id}')">📂 Abrir</button>
        <button style="flex:1;background:#c62828;color:#fff;border:none;border-radius:8px;padding:10px 0;font-size:14px;font-weight:600;" onclick="excluirRascunho('${id}')">🗑 Excluir</button>
      </div>`;
    container.appendChild(row);
  });
  document.getElementById('drafts-sheet').classList.add('show');
  document.getElementById('drafts-overlay').classList.add('show');
}

function fecharRascunhos() {
  document.getElementById('drafts-sheet').classList.remove('show');
  document.getElementById('drafts-overlay').classList.remove('show');
}

function carregarRascunho(id) {
  const raw = localStorage.getItem(id);
  if (!raw) { toast('❌ Ordem não encontrada.'); return; }
  let dados;
  try { dados = JSON.parse(raw); } catch(e) { toast('❌ Erro ao ler ordem.'); return; }
  aplicarDados(dados);
  window._osIdAtual = id;
  fecharRascunhos();
  toast('📂 Ordem carregada!', 3000);
}

function excluirRascunho(id) {
  if (!confirm('Excluir esta ordem?')) return;
  localStorage.removeItem(id);
  const lista = JSON.parse(localStorage.getItem('jm_os_lista') || '[]');
  localStorage.setItem('jm_os_lista', JSON.stringify(lista.filter(x => x !== id)));
  if (window._osIdAtual === id) { window._osIdAtual = null; }
  abrirRascunhos();
  toast('🗑 Excluído.', 2000);
}

function limpar() {
  if (!confirm('Limpar todos os campos?')) return;
  window._osIdAtual = null;
  document.querySelectorAll('#os-page input').forEach(i => { i.value = ''; });
  document.getElementById('f-data').value = new Date().toISOString().split('T')[0];
  toast('🆕 Nova OS!', 2000);
}

// ── EXPORTAR / IMPORTAR ──────────────────────────────────────────────────────
function nomeArquivoDados() {
  const c = (document.getElementById('f-cliente').value.trim() || 'OS').replace(/\s+/g,'_');
  const n = document.getElementById('f-num').value.trim();
  return `OS_JMTrianon_${c}${n ? '_' + n : ''}.json`;
}

async function exportarArquivo() {
  const dados = coletarDados();
  dados._meta = {
    cliente: document.getElementById('f-cliente').value.trim() || 'Sem nome',
    carro:   document.getElementById('f-carro').value.trim() || '',
    placa:   document.getElementById('f-placa').value.trim() || '',
    num:     document.getElementById('f-num').value.trim() || '',
    salvoEm: new Date().toLocaleString('pt-BR')
  };
  const conteudo = JSON.stringify(dados, null, 2);
  const nome = nomeArquivoDados();
  const blob = new Blob([conteudo], { type: 'application/json' });
  if ('showSaveFilePicker' in window) {
    try {
      const fh = await window.showSaveFilePicker({ suggestedName: nome, types: [{ description: 'OS', accept: { 'application/json': ['.json'] } }] });
      const w = await fh.createWritable();
      await w.write(conteudo); await w.close();
      toast('✅ Exportado!', 4000); return;
    } catch(e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('📥 Salvo em Downloads: ' + nome, 5000);
}

function importarArquivo() { document.getElementById('import-file-input').click(); }
document.getElementById('import-file-input').addEventListener('change', function() {
  const file = this.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const dados = JSON.parse(e.target.result);
      aplicarDados(dados);
      window._osIdAtual = null;
      toast('✅ Importado com sucesso!', 3000);
    } catch(err) { toast('❌ Arquivo inválido.'); }
  };
  reader.readAsText(file);
  this.value = '';
});

// ── CAPTURA — ESTRATÉGIA DO CLONE ────────────────────────────────────────────
// A única forma 100% confiável de capturar inputs no html2canvas:
// 1. Clonar toda a página (#os-page)
// 2. No clone, substituir cada <input> por um <div> com o mesmo texto e estilo
// 3. Fotografar o clone (não a página real)
// 4. Remover o clone
// Assim o usuário nunca vê nada piscando, e o texto sempre aparece correto.

async function capture() {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  window.scrollTo(0, 0);
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e) {} }
  await new Promise(r => setTimeout(r, 200));

  const original = document.getElementById('os-page');

  // Clonar
  const clone = original.cloneNode(true);
  clone.style.cssText = `
    position:fixed; left:-9999px; top:0;
    width:794px; min-width:794px;
    background:#fff; padding:10mm 10mm 8mm 10mm;
  `;

  // Substituir inputs do clone por divs com o texto real (lido do original)
  const origInputs  = Array.from(original.querySelectorAll('input'));
  const cloneInputs = Array.from(clone.querySelectorAll('input'));

  cloneInputs.forEach((ci, i) => {
    const oi = origInputs[i];
    if (!oi) return;
    const cs = getComputedStyle(oi);
    const div = document.createElement('div');
    div.textContent = oi.value;
    div.style.cssText = `
      font-family:${cs.fontFamily};
      font-size:${cs.fontSize};
      font-weight:${cs.fontWeight};
      color:${cs.color || '#1a1a2e'};
      text-align:${cs.textAlign};
      width:100%; height:100%;
      padding:${cs.padding};
      line-height:normal;
      display:flex; align-items:center;
      background:transparent;
      overflow:hidden; white-space:nowrap;
    `;
    if (cs.textAlign === 'right' || cs.textAlign === 'center') {
      div.style.justifyContent = cs.textAlign === 'right' ? 'flex-end' : 'center';
    }
    ci.parentNode.replaceChild(div, ci);
  });

  document.body.appendChild(clone);
  await new Promise(r => setTimeout(r, 50));

  const canvas = await html2canvas(clone, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#ffffff',
    logging: false,
    scrollX: 0, scrollY: 0,
    windowWidth: 794,
    windowHeight: clone.scrollHeight,
    width: 794,
    height: clone.scrollHeight
  });

  document.body.removeChild(clone);
  return canvas;
}

function nomeArquivo() {
  const c = (document.getElementById('f-cliente').value.trim() || 'OS').replace(/\s+/g,'_');
  const n = document.getElementById('f-num').value.trim();
  return `OS_JMTrianon_${c}${n ? '_' + n : ''}.png`;
}

function setLoading(on, msg = 'Aguarde...') {
  document.getElementById('loading-msg').textContent = msg;
  document.getElementById('loading').classList.toggle('show', on);
}

function enviarWhatsapp() {
  openSheet();
}

async function enviarWhatsappImg() {
  closeSheet();
  setLoading(true, 'Gerando imagem...');
  try {
    const canvas = await capture();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const file = new File([blob], nomeArquivo(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Ordem de Serviço JM Trianon' });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = nomeArquivo();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('📥 Imagem salva!', 4000);
    }
  } catch(e) {
    if (e.name !== 'AbortError') toast('❌ Erro ao gerar imagem.');
  } finally {
    setLoading(false);
  }
}

async function downloadImagem() {
  closeSheet();
  setLoading(true, 'Gerando imagem...');
  try {
    const canvas = await capture();
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = nomeArquivo();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('📥 Imagem salva!', 4000);
  } catch(e) {
    toast('❌ Erro ao gerar imagem.');
  } finally {
    setLoading(false);
  }
}

function openSheet()  {
  document.getElementById('action-sheet').classList.add('show');
  document.getElementById('sheet-overlay').classList.add('show');
}
function closeSheet() {
  document.getElementById('action-sheet').classList.remove('show');
  document.getElementById('sheet-overlay').classList.remove('show');
}

function toast(msg, ms = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}

// ── MÁSCARA TELEFONE ────────────────────────────────────────────────────────
function mascaraTel(el) {
  let v = el.value.replace(/\D/g, '').slice(0, 11);
  if (v.length > 10) {
    v = '(' + v.slice(0,2) + ') ' + v.slice(2,7) + '-' + v.slice(7);
  } else if (v.length > 6) {
    v = '(' + v.slice(0,2) + ') ' + v.slice(2,6) + '-' + v.slice(6);
  } else if (v.length > 2) {
    v = '(' + v.slice(0,2) + ') ' + v.slice(2);
  } else if (v.length > 0) {
    v = '(' + v;
  }
  el.value = v;
}

// Zoom nativo do navegador habilitado

// ── PWA ──────────────────────────────────────────────────────────────────────
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
async function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ── AUTO-SAVE ao minimizar ou fechar ─────────────────────────────────────────
// Salva no localStorage do app E baixa arquivo JSON em Downloads do celular
function autoSave() {
  const cliente = document.getElementById('f-cliente').value.trim();
  if (!cliente) return;
  const dados = coletarDados();
  const id = window._osIdAtual || AUTO_ID;
  window._osIdAtual = id;
  dados._meta = {
    cliente: cliente,
    carro:   document.getElementById('f-carro').value.trim() || '',
    placa:   document.getElementById('f-placa').value.trim() || '',
    num:     document.getElementById('f-num').value.trim()   || '',
    salvoEm: '🔄 Auto · ' + new Date().toLocaleString('pt-BR')
  };
  const json = JSON.stringify(dados, null, 2);
  // Salva no app
  try {
    localStorage.setItem(id, json);
    let lista = JSON.parse(localStorage.getItem('jm_os_lista') || '[]');
    if (!lista.includes(id)) { lista.unshift(id); localStorage.setItem('jm_os_lista', JSON.stringify(lista)); }
  } catch(e) {}
  // Salva arquivo direto em Downloads sem abrir seletor
  try {
    const nome = 'OS_JMTrianon_' + cliente.replace(/\s+/g,'_') + '_auto.json';
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch(e) {}
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') autoSave(); });
window.addEventListener('pagehide', autoSave);
</script>
